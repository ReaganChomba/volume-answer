plugins { id 'com.android.application' }
android {
    namespace "com.example.sensoranswer"
    compileSdk 31
    defaultConfig {
        applicationId "com.example.sensoranswer"
        minSdk 21
        targetSdk 31
        versionCode 1
        versionName "1.0"
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
repositories {
    google()
    mavenCentral()
    maven { url 'https://dl.cloudsmith.io/public/rovo89/xposed/maven/' }
}
dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
